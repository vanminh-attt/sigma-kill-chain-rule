title: Data Staged into Password Protected Archive
id: 2fbed122-a518-4a77-8da1-b6c7d8e9fa0b
status: test
description: Nen du lieu co mat khau bang rar/7z/winrar truoc khi mang ra ngoai
references:
    - https://attack.mitre.org/techniques/T1560/001/
author: Purple Team Lab
date: 2026-07-31
tags:
    - attack.collection
    - attack.t1560.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_img_path:
        Image|endswith:
            - '\rar.exe'
            - '\7z.exe'
            - '\7za.exe'
            - '\winrar.exe'
            - '\7zg.exe'
    selection_img_orig:
        OriginalFileName:
            - 'Rar.exe'
            - '7z.exe'
    selection_cli:
        CommandLine|contains:
            - ' -hp'
            - ' -p'
    condition: (selection_img_path or selection_img_orig) and selection_cli
falsepositives:
    - Nguoi dung nen file co mat khau hop le
level: medium
