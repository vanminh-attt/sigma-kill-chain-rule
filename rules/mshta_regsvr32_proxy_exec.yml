title: Proxy Execution via mshta or regsvr32 (Squiblydoo)
id: 2fbec611-a518-4497-a3a1-b0c1d2e3fa0b
status: test
description: mshta.exe chay noi dung tu URL/script, hoac regsvr32.exe dung scrobj.dll de chay script tu xa
references:
    - https://attack.mitre.org/techniques/T1218/010/
author: Purple Team Lab
date: 2026-07-31
tags:
    - attack.stealth
    - attack.t1218.005
    - attack.t1218.010
logsource:
    product: windows
    category: process_creation
detection:
    selection_mshta:
        Image|endswith: '\mshta.exe'
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - 'javascript:'
            - 'vbscript:'
            - '.hta'
    selection_regsvr32:
        Image|endswith: '\regsvr32.exe'
        CommandLine|contains:
            - 'scrobj.dll'
            - '/i:http'
            - '-i:http'
    condition: 1 of selection_*
falsepositives:
    - Ung dung cu dung HTA de cai dat
level: high
