title: Executable Attachment Written by Outlook
id: 8b7a0277-61d4-4053-9f67-7c8d9eafb0c7
status: experimental
description: Outlook ghi file thuc thi/script ra thu muc tam - dau hieu Delivery qua email dinh kem
references:
    - https://attack.mitre.org/techniques/T1566/001/
author: Purple Team Lab
date: 2026-07-31
tags:
    - attack.initial-access
    - attack.t1566.001
logsource:
    product: windows
    category: file_event
detection:
    selection:
        Image|endswith: '\outlook.exe'
        TargetFilename|endswith:
