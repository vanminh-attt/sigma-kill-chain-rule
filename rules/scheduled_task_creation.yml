title: Scheduled Task Created via schtasks
id: 63f20a55-e95c-48bb-c7e5-fa0b1c2d3e4f
status: test
description: Tao scheduled task bang schtasks /create - persistence pho bien
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: Purple Team Lab
date: 2026-07-31
tags:
    - attack.persistence
    - attack.execution
    - attack.t1053.005
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    selection_susp:
        CommandLine|contains:
            - 'powershell'
            - 'mshta'
            - 'rundll32'
            - 'regsvr32'
            - '\AppData\'
            - '\Temp\'
            - '-enc'
            - '/ru system'
    condition: all of selection*
falsepositives:
    - Script trien khai cua he thong quan tri
level: high
